name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Install all required system dependencies for Bevy
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libwayland-dev libx11-dev libasound2-dev libudev-dev

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
