name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Install required system dependencies for Bevy/Wayland
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libwayland-dev libx11-dev libasound2-dev

    # 2. Automatically cache Rust build dependencies to speed up subsequent CI runs
    - name: Setup Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
